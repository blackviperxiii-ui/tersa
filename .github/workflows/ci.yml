name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:
  merge_group:
  # Nightly full run (3:35 AM Central during CDT): the Node 20 + 22 matrix and
  # the generated example build that PRs skip.
  schedule:
    - cron: "35 8 * * *"

permissions:
  contents: read

# A newer push to the same PR or to beta cancels the run it replaces; the newer
# beta run repeats the full matrix. The group includes the event, so a beta push
# never cancels the nightly run on beta. Pushes to main always finish.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/beta') }}

# PRs run the short gate: format, and one lint + typecheck + test + build job
# on Node 22. The full Node 20/22 matrix and the generated example build run on
# push to beta/main, nightly and on manual runs. The nightly skips lint-test
# and full when its commit already passed CI. Path gating is a job-level `if:`
# on the `changes` output, never a workflow-level filter, so skipped required
# checks still report. See docs/ci-policy.md.
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      code: ${{ steps.nightly.outputs.passed != 'true' && (github.event_name != 'pull_request' || steps.filter.outputs.code == 'true') }}
      full: ${{ steps.nightly.outputs.passed != 'true' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    steps:
      # A nightly on a commit that already passed a push, nightly or manual CI
      # run (each runs the full matrix) would only repeat it. If the lookup
      # fails, the nightly runs.
      - name: Skip nightly if this commit already passed
        id: nightly
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=50" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "schedule" or .event == "workflow_dispatch")] | length' 2>/dev/null) || passed=0
          case "$passed" in ''|*[!0-9]*) passed=0 ;; esac
          if [ "$passed" -gt 0 ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "${GITHUB_SHA} already passed CI; skipping the nightly rerun."
          fi
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'

  # format doesn't wait on `changes`: a failed `changes` job would skip it, and a
  # skipped required check counts as passed. It also runs on a skipped nightly.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .

  lint-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec eslint .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  full:
    name: full (Node ${{ matrix.node }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Build the generated example
        run: pnpm verify:example
